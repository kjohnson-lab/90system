<style>
  :root{
    --bg:#F5F6FA; --surface:#FFFFFF; --surface-alt:#F0F1F5; --border:#E2E4EC;
    --text:#14181F; --text-dim:#5B6270; --text-faint:#8A90A0;
    --red:#C8102E; --red-soft:#FBE9EC;
    --navy:#14224B; --royal:#2E4BD9; --royal-soft:#EBEEFC;
    --green:#0F8A5F; --green-soft:#E7F6EF;
    --amber:#AD6E08; --amber-soft:#FCF1DC;
    --steel:#5B6EA8; --steel-soft:#EAECF7;
    --violet:#6B4FCC; --violet-soft:#EFEAFB;
    --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .digits{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit; font-size:14px;}
  a{color:var(--royal);}

  #app{min-height:100vh; display:flex; flex-direction:column;}
  .wrap{max-width:1100px; margin:0 auto; width:100%; padding:0 24px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; background:var(--surface);}
  .topbar-inner{max-width:1100px; margin:0 auto; width:100%; padding:0 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand-icon{width:32px; height:32px; border-radius:7px; overflow:hidden; flex-shrink:0; border:1px solid var(--border);}
  .brand-icon img{width:100%; height:100%; object-fit:contain;}
  .brand-name{font-weight:800; font-size:15px; letter-spacing:-.01em; color:var(--text);}
  .brand-sub{font-size:11px; color:var(--text-faint); letter-spacing:.03em;}
  .topbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .pill-btn{background:var(--surface); border:1px solid var(--border); color:var(--text-dim); padding:7px 13px; border-radius:7px; font-size:12.5px; font-weight:600; transition:.15s;}
  .pill-btn:hover{border-color:var(--royal); color:var(--royal);}

  .page-body{background:var(--bg); flex:1;}

  .landing{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 20px; background:var(--surface);}
  .landing-icon{width:64px; height:64px; border-radius:14px; overflow:hidden; border:1px solid var(--border); margin-bottom:20px; box-shadow:0 2px 12px rgba(20,24,31,.06);}
  .landing-icon img{width:100%; height:100%; object-fit:contain;}
  .landing-title{font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--text);}
  .landing-sub{font-size:13px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:4px; font-weight:600;}
  .landing-tag{color:var(--text-dim); max-width:460px; margin:16px auto 36px; font-size:14.5px; line-height:1.6;}
  .role-row{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}
  .role-card{width:230px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px 20px; text-align:left; transition:.15s; box-shadow:0 1px 3px rgba(20,24,31,.04);}
  .role-card:hover{border-color:var(--royal); box-shadow:0 4px 16px rgba(20,24,31,.08); transform:translateY(-1px);}
  .role-card .r-label{font-weight:800; font-size:15px; letter-spacing:-.01em; margin-bottom:5px; color:var(--text);}
  .role-card .r-desc{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .role-card .r-tag{display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:5px; margin-bottom:10px;}
  .role-card.coach .r-tag{background:var(--red-soft); color:var(--red);}
  .role-card.player .r-tag{background:var(--royal-soft); color:var(--royal);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px; flex-wrap:wrap; gap:10px;}
  .section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px;}
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:0 1px 2px rgba(20,24,31,.03);}
  .kpi-value{font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--text);}
  .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-top:3px; font-weight:600;}

  .tabs{display:flex; gap:4px; background:var(--surface-alt); border-radius:8px; padding:3px;}
  .tab-btn{background:transparent; border:none; color:var(--text-dim); padding:6px 14px; border-radius:6px; font-size:12.5px; font-weight:600;}
  .tab-btn.active{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(20,24,31,.08);}

  .data-table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .data-table thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--surface-alt);}
  .data-table tbody tr{border-bottom:1px solid var(--border); cursor:pointer; transition:.1s;}
  .data-table tbody tr:last-child{border-bottom:none;}
  .data-table tbody tr:hover{background:var(--surface-alt);}
  .data-table td{padding:11px 14px; font-size:13.5px; vertical-align:middle;}
  .cell-name{font-weight:700; color:var(--text);}
  .cell-meta{font-size:11.5px; color:var(--text-faint); margin-top:1px;}
  .cell-ovr{font-family:var(--font-mono); font-weight:700; font-size:15px;}
  .trend-up{color:var(--green);} .trend-down{color:var(--red);} .trend-flat{color:var(--text-faint);}
  .status-chip{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:5px; display:inline-block; text-transform:uppercase; letter-spacing:.03em;}
  .status-club90{background:var(--green-soft); color:var(--green);}
  .status-elite{background:var(--royal-soft); color:var(--royal);}
  .status-rising{background:var(--amber-soft); color:var(--amber);}
  .status-solid{background:var(--steel-soft); color:var(--steel);}
  .status-needs{background:var(--red-soft); color:var(--red);}
  .status-ungraded{background:var(--surface-alt); color:var(--text-faint);}

  .empty-state{border:1px dashed var(--border); border-radius:12px; padding:40px 20px; text-align:center; color:var(--text-dim); background:var(--surface);}
  .empty-state .es-title{font-weight:700; color:var(--text); font-size:15px; margin-bottom:6px;}

  .form-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; box-shadow:0 1px 2px rgba(20,24,31,.03);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:8px 10px; outline:none;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--royal); box-shadow:0 0 0 3px var(--royal-soft);}
  .field-row{display:flex; gap:10px; flex-wrap:wrap;}
  .field-row .field{flex:1; min-width:100px;}
  .btn{background:var(--navy); color:#fff; border:none; border-radius:7px; padding:9px 18px; font-weight:700; font-size:13px;}
  .btn:hover{background:#0d1836;}
  .btn.primary{background:var(--red);}
  .btn.primary:hover{background:#a80d26;}
  .btn.secondary{background:var(--surface); border:1px solid var(--border); color:var(--text);}
  .btn.secondary:hover{border-color:var(--text-faint);}
  .btn.danger{background:transparent; border:1px solid var(--red); color:var(--red);}

  .cat-section{border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; background:var(--surface-alt);}
  .cat-section-title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:10px;}
  .cat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:8px;}
  .mini-field label{font-size:9.5px; text-transform:uppercase; color:var(--text-faint); font-weight:700; display:block; margin-bottom:3px;}
  .mini-field input, .mini-field select{width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 7px; font-size:13px;}

  .metric-row{display:grid; grid-template-columns:100px 1fr 40px; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border);}
  .metric-row:last-child{border-bottom:none;}
  .metric-label{font-size:12px; font-weight:600; color:var(--text-dim);}
  .metric-track{position:relative; height:6px; background:var(--surface-alt); border-radius:4px;}
  .metric-fill{height:100%; border-radius:4px;}
  .metric-value{font-family:var(--font-mono); font-size:13px; font-weight:700; text-align:right;}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chip{font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface);}

  .overlay{position:fixed; inset:0; background:rgba(20,24,31,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; overflow-y:auto;}
  .drawer{background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:680px; max-height:90vh; overflow-y:auto; padding:24px; margin:auto; box-shadow:0 20px 60px rgba(20,24,31,.25);}
  .drawer-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; gap:10px; padding-bottom:16px; border-bottom:1px solid var(--border);}
  .drawer-close{background:var(--surface-alt); border:1px solid var(--border); color:var(--text-dim); border-radius:7px; padding:6px 12px; flex-shrink:0; font-size:12.5px; font-weight:600;}

  .stat-hero{display:flex; align-items:center; gap:24px; margin-bottom:18px; flex-wrap:wrap;}
  .stat-hero-num{font-family:var(--font-mono); font-size:44px; font-weight:800; color:var(--text); line-height:1;}
  .stat-hero-label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); font-weight:700; margin-top:4px;}

  .history-item{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .history-item:last-child{border-bottom:none;}
  .history-sub{color:var(--text-faint); font-size:11.5px;}

  .link-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .link-row a{font-size:11.5px; font-weight:600; padding:5px 11px; border:1px solid var(--border); border-radius:6px; color:var(--royal); background:var(--royal-soft);}

  .footer-note{text-align:center; color:var(--text-faint); font-size:11px; padding:32px 0 16px;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:100; box-shadow:0 6px 20px rgba(20,24,31,.25);}
  .toast.show{opacity:1;}

  .pin-shell{display:flex; flex-direction:column; align-items:center; text-align:center; padding:70px 20px; background:var(--surface); flex:1;}
  .pin-shell .form-card{max-width:280px; width:100%; text-align:left; margin-top:16px;}
  .err-text{color:var(--red); font-size:12.5px; margin-bottom:8px; font-weight:600;}

  @media(max-width:560px){
    .role-row{flex-direction:column; align-items:center;}
    .role-card{width:100%; max-width:280px;}
    .data-table{display:block; overflow-x:auto; white-space:nowrap;}
  }
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

  function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
  function round1(v){ return Math.round(v*10)/10; }

  /* ---------------- scoring engine (unchanged from the spreadsheet-matched version) ---------------- */
  function computePractice(p){
    var total = (p.effort|0)+(p.technique|0)+(p.assignment|0)+(p.finish|0)+(p.physicality|0)+(p.coachability|0);
    var score = clamp(round1(total*3.333),0,100);
    var tier = total>=28?'Champion': total>=25?'Winning': total>=22?'Average': total>=18?'Needs Improvement':'Poor';
    return {total:total, score:score, tier:tier};
  }
  function computeWeightRoom(w){
    var total = (w.attendance|0)+(w.intent|0)+(w.technique|0)+(w.finish|0)+(w.leadership|0);
    var liftGrade = clamp(total*4,0,100);
    var rating = liftGrade>=96?'Elite': liftGrade>=90?'Winning': liftGrade>=80?'Average': liftGrade>=70?'Needs Improvement':'Poor';
    var attendanceScore = clamp((w.attendance|0)*20,0,100);
    return {total:total, liftGrade:liftGrade, rating:rating, attendanceScore:attendanceScore};
  }
  function computeFilm(f){
    var total = (f.gamefilm|0)+(f.opponentFilm|0)+(f.practiceFilm|0);
    var rating = clamp(round1((total/15)*100),0,100);
    return {total:total, rating:rating};
  }
  function computeAcademics(a){
    var bonus = a.teacherCheck==='Good'?10:(a.teacherCheck==='Concern'?-10:0);
    var score = clamp(Math.round((parseFloat(a.gpa)||0)*25 - (a.missingWork|0)*5 + bonus),0,100);
    return score;
  }
  function computeBehavior(b){
    var score = clamp(Math.round(100 - (b.tardies|0)*5 - (b.referrals|0)*20 - (b.detentions|0)*10 + (b.coachable?5:0)),0,100);
    return score;
  }
  function computeWeeklyScore(practiceScore, liftGrade, filmRating, gameGrade, leadershipScore){
    return round1((practiceScore*0.35)+(liftGrade*0.15)+(filmRating*0.1)+(gameGrade*0.3)+(leadershipScore*0.1));
  }
  function computeOVR(summerOVR, weeklyScore){
    return Math.min(99, Math.round(summerOVR + (weeklyScore-75)/5));
  }
  function statusForOVR(ovr){
    if (ovr>=90) return {text:'90+ Club', cls:'status-club90'};
    if (ovr>=85) return {text:'Elite', cls:'status-elite'};
    if (ovr>=80) return {text:'Rising', cls:'status-rising'};
    if (ovr>=75) return {text:'Solid', cls:'status-solid'};
    return {text:'Needs Work', cls:'status-needs'};
  }

  function latestWeek(player){
    var w = player.weeks || [];
    return w.length ? w[w.length-1] : null;
  }
  function currentOVR(player){
    var w = latestWeek(player);
    return w ? w.ovr : Math.round(player.summerOVR);
  }
  function currentStatusObj(player){
    var w = latestWeek(player);
    if (!w) return {text:'Not yet graded', cls:'status-ungraded'};
    return statusForOVR(w.ovr);
  }
  function currentTrend(player){
    var w = latestWeek(player);
    if (!w) return {arrow:'—', change:0, cls:'trend-flat'};
    var change = w.ovr - player.summerOVR;
    var arrow = change>0?'▲':(change<0?'▼':'—');
    var cls = change>0?'trend-up':(change<0?'trend-down':'trend-flat');
    return {arrow:arrow, change:change, cls:cls};
  }

  var BADGE_DEFS = [
    {label:'Iron Bull', metric:function(w){return w.weightRoom.liftGrade;}, tiers:[75,80,85,90]},
    {label:'Explosive', metric:function(w){return w.weightRoom.liftGrade;}, tiers:[75,80,85,90]},
    {label:'Captain', metric:function(w){return w.leadershipScore;}, tiers:[75,80,85,90]},
    {label:'Dependable', metric:function(w){return w.weightRoom.attendanceScore;}, tiers:[80,90,95,100]},
    {label:'Practice Dawg', metric:function(w){return w.practice.score;}, tiers:[75,80,85,90]},
    {label:'Gamer', metric:function(w){return w.gameScore;}, tiers:[75,80,85,90]},
    {label:'Honor Roll', metric:function(w){return w.academicsScore;}, tiers:[80,85,90,95]}
  ];
  var TIER_NAMES = ['Bronze','Silver','Gold','Elite'];

  function computeBadges(player){
    var w = latestWeek(player);
    if (!w) return [];
    var badges = [];
    BADGE_DEFS.forEach(function(def){
      var val = def.metric(w);
      var name = null;
      if (val>=def.tiers[3]) name = TIER_NAMES[3];
      else if (val>=def.tiers[2]) name = TIER_NAMES[2];
      else if (val>=def.tiers[1]) name = TIER_NAMES[1];
      else if (val>=def.tiers[0]) name = TIER_NAMES[0];
      if (name) badges.push({label:def.label, tier:name});
    });
    return badges;
  }

    try{

      if (raw){ state.team = JSON.parse(raw); }
      else{ state.team.roster = ROSTER_SEED.map(function(r){ return newPlayer(r); }); saveTeam(); }
    }catch(e){}
    try{
      var rawView = localStorage.getItem(VIEW_KEY);
      if (rawView){ var v = JSON.parse(rawView); if (v.view==='coach'||v.view==='student') state.view=v.view; }
    }catch(e){}
    state.ready = true;
    render();

  function logWeekForPlayer(player){
    var val = function(id){ return document.getElementById(id).value; };
    var num = function(id){ return parseFloat(val(id))||0; };

    var practice = computePractice({effort:num('pr-effort'),technique:num('pr-technique'),assignment:num('pr-assignment'),finish:num('pr-finish'),physicality:num('pr-physicality'),coachability:num('pr-coachability')});
    var weightRoom = computeWeightRoom({attendance:num('wr-attendance'),intent:num('wr-intent'),technique:num('wr-technique'),finish:num('wr-finish'),leadership:num('wr-leadership')});
    var film = computeFilm({gamefilm:num('fl-gamefilm'),opponentFilm:num('fl-opponentfilm'),practiceFilm:num('fl-practicefilm')});
    var gameScore = clamp(num('gm-grade'),0,100);
    var leadershipRating = clamp(num('ld-rating'),0,3);
    var leadershipScore = clamp(round1(leadershipRating*33.33),0,100);
    var academicsScore = computeAcademics({gpa:num('ac-gpa'), missingWork:num('ac-missing'), teacherCheck:val('ac-teacher')});
    var behaviorScore = computeBehavior({tardies:num('bh-tardies'), referrals:num('bh-referrals'), detentions:num('bh-detentions'), coachable:val('bh-coachable')==='yes'});
    var weeklyScore = computeWeeklyScore(practice.score, weightRoom.liftGrade, film.rating, gameScore, leadershipScore);
    var ovr = computeOVR(player.summerOVR, weeklyScore);

    player.weeks.push({
      label: val('wk-label') || ('Week '+(player.weeks.length+1)),
      practice: practice, weightRoom: weightRoom, filmScore: film.rating, gameScore: gameScore, gradedBy: val('gm-gradedby'),
      leadershipScore: leadershipScore, academicsScore: academicsScore, behaviorScore: behaviorScore,
      weeklyScore: weeklyScore, ovr: ovr
    });
  }

  document.getElementById('app').addEventListener('change', function(e){
    if (e.target.id !== 'import-file') return;
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.roster)) throw new Error('bad shape');
        state.pendingImport = parsed;
        render();
      }catch(err){ showToast("That file doesn't look like a 90+ export"); }
    };
    reader.onerror = function(){ showToast("Couldn't read that file"); };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('app').addEventListener('click', function(e){
    if (e.target.classList && e.target.classList.contains('overlay')){
      state.detailId=null; state.confirmRemoveId=null; state.pendingImport=null; render(); return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action==='go-coach'){
      state.pinError='';
      if (!state.team.coachPin){ state.view='pin-setup'; }
      else if (state.coachAuthed){ state.view='coach'; }
      else { state.view='pin-entry'; }
      saveMyView(); render();
    }
    else if (action==='save-new-pin'){
      var p1 = document.getElementById('pin-new').value.trim();
      var p2 = document.getElementById('pin-confirm').value.trim();
      if (!/^\d{4}$/.test(p1)){ state.pinError='PIN must be exactly 4 digits'; render(); return; }
      if (p1!==p2){ state.pinError='PINs don\'t match'; render(); return; }
      state.team.coachPin = p1; state.coachAuthed = true; state.pinError='';
      saveTeam(); state.view='coach'; saveMyView(); render();
      showToast('Coach PIN set');
    }
    else if (action==='submit-pin'){
      var attempt = document.getElementById('pin-attempt').value.trim();
      if (attempt === state.team.coachPin){ state.coachAuthed=true; state.pinError=''; state.view='coach'; saveMyView(); render(); }
      else { state.pinError='Incorrect PIN'; render(); }
    }
    else if (action==='change-pin'){
      state.team.coachPin=''; state.coachAuthed=false; saveTeam(); state.view='pin-setup'; render();
    }
    else if (action==='go-student'){ state.view='student'; state.currentStudentId=null; state.coachAuthed=false; saveMyView(); render(); }
    else if (action==='go-landing'){ state.view='landing'; state.detailId=null; state.currentStudentId=null; state.coachAuthed=false; saveMyView(); render(); }
    else if (action==='toggle-leaderboard'){ state.team.leaderboardVisible=!state.team.leaderboardVisible; saveTeam(); render(); }
    else if (action==='filter-group'){ state.team.groupFilter = el.getAttribute('data-group'); render(); }
    else if (action==='add-player'){
      var name = document.getElementById('new-name').value.trim();
      if (!name){ showToast('Enter a name first'); return; }
      state.team.roster.push(newPlayer({
        name:name, jersey:document.getElementById('new-jersey').value.trim(), grade:document.getElementById('new-grade').value.trim(),
        primaryPos:document.getElementById('new-primary').value.trim(), secondaryPos:document.getElementById('new-secondary').value.trim(),
        group:document.getElementById('new-group').value, summerOVR:document.getElementById('new-summer').value
      }));
      saveTeam(); render();
    }
    else if (action==='import-roster'){
      var raw = document.getElementById('import-text').value;
      var lines = raw.split('\n').map(function(l){return l.trim();}).filter(Boolean);
      var added = 0;
      lines.forEach(function(line){
        var parts = line.split(',').map(function(p){return p.trim();});
        if (parts[0]){ state.team.roster.push(newPlayer({name:parts[0],jersey:parts[1],grade:parts[2],primaryPos:parts[3],secondaryPos:parts[4],group:parts[5],summerOVR:parts[6]})); added++; }
      });
      if (!added){ showToast('Paste at least one line'); return; }
      showToast('Added '+added+' player'+(added===1?'':'s'));
      saveTeam(); render();
    }
    else if (action==='export-data'){
      try{
        var blob = new Blob([JSON.stringify(state.team,null,2)], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '90plus-'+(state.team.teamName||'team').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);},1000);
        showToast('Exported — send this file to the other coach');
      }catch(e){ showToast("Couldn't export"); }
    }
    else if (action==='trigger-import'){ document.getElementById('import-file').click(); }
    else if (action==='confirm-import-replace'){
      var parsed = state.pendingImport;
      if (parsed){ state.team = {teamName:parsed.teamName||state.team.teamName, leaderboardVisible:(typeof parsed.leaderboardVisible==='boolean')?parsed.leaderboardVisible:state.team.leaderboardVisible, groupFilter:'All', roster:parsed.roster, coachPin:parsed.coachPin||state.team.coachPin}; saveTeam(); }
      state.pendingImport=null; render();
    }
    else if (action==='confirm-import-merge'){
      var parsed = state.pendingImport;
      if (parsed && Array.isArray(parsed.roster)){
        var existing = state.team.roster.map(function(p){return p.name.trim().toLowerCase();});
        var added=0, skipped=0;
        parsed.roster.forEach(function(incoming){
          var key = (incoming.name||'').trim().toLowerCase();
          if (key && existing.indexOf(key)===-1){ state.team.roster.push(incoming); existing.push(key); added++; } else { skipped++; }
        });
        saveTeam();
        showToast('Added '+added+(skipped?(' — skipped '+skipped+' already on roster'):''));
      }
      state.pendingImport=null; render();
    }
    else if (action==='cancel-import'){ state.pendingImport=null; render(); }
    else if (action==='open-player'){ state.detailId = el.getAttribute('data-id'); render(); }
    else if (action==='close-drawer'){ state.detailId=null; state.confirmRemoveId=null; render(); }
    else if (action==='remove-player'){ state.confirmRemoveId = el.getAttribute('data-id'); render(); }
    else if (action==='cancel-remove-player'){ state.confirmRemoveId=null; render(); }
    else if (action==='confirm-remove-player'){
      var id = el.getAttribute('data-id');
      state.team.roster = state.team.roster.filter(function(p){return p.id!==id;});
      state.detailId=null; state.confirmRemoveId=null; saveTeam(); render();
    }
    else if (action==='save-links'){
      var id = el.getAttribute('data-id');
      var player = findPlayer(id);
      if (!player) return;
      player.hudl = document.getElementById('link-hudl').value.trim();
      player.highlight = document.getElementById('link-highlight').value.trim();
      player.lastGame = document.getElementById('link-lastgame').value.trim();
      saveTeam(); render();
    }
    else if (action==='log-week'){
      var id = el.getAttribute('data-id');
      var player = findPlayer(id);
      if (!player) return;
      logWeekForPlayer(player);
      saveTeam(); render();
      showToast('Week saved');
    }
    else if (action==='toggle-join-form'){ state.showJoinForm=true; render(); }
    else if (action==='create-join-file'){
      var jName = document.getElementById('join-name').value.trim();
      if (!jName){ showToast('Enter your name first'); return; }
      try{
        var payload = {teamName:state.team.teamName, leaderboardVisible:state.team.leaderboardVisible, roster:[newPlayer({name:jName,jersey:document.getElementById('join-jersey').value.trim(),group:document.getElementById('join-group').value,summerOVR:70})]};
        var blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = '90plus-join-'+jName.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(url);},1000);
        showToast('Join file ready — send it to your coach');
      }catch(e){ showToast("Couldn't create file"); }
    }
    else if (action==='view-self'){
      var sel = document.getElementById('student-select').value;
      if (!sel){ showToast('Pick a name first'); return; }
      state.currentStudentId = sel; saveMyView(); render();
    }
    else if (action==='switch-student'){ state.currentStudentId=null; render(); }
  });

  loadAll();
})();
</script>
</body>
</html>
